name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/test.py
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.2.1-release
          swift-build: 6.2.1-RELEASE
      - name: Prepare pinned Windows projections
        shell: pwsh
        run: ./Scripts/setup-dependencies.ps1
      - run: swift build -c release
